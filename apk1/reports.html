<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>التقارير</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-shield-halved"></i></div><span>التقارير</span></div>
  <div style="width:40px;"></div>
</div>

<div class="app-container">
  <div class="page-content">

    <div class="chip-scroll mb-3">
      <button class="chip active" data-period="day">يومي</button>
      <button class="chip" data-period="week">أسبوعي</button>
      <button class="chip" data-period="month">شهري</button>
      <button class="chip" data-period="year">سنوي</button>
      <button class="chip" data-period="custom">حسب التاريخ</button>
    </div>

    <div class="row g-2 mb-3" id="customDateRange" style="display:none;">
      <div class="col-6"><input type="date" id="dateFrom" class="form-control"></div>
      <div class="col-6"><input type="date" id="dateTo" class="form-control"></div>
    </div>

    <div class="form-group">
      <select id="filterCustomer" class="form-select">
        <option value="">كل العملاء</option>
      </select>
    </div>

    <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
      <div class="mini-stat navy"><div class="num" id="rDebts">0</div><div class="lbl">إجمالي الديون</div></div>
      <div class="mini-stat green"><div class="num" id="rPayments">0</div><div class="lbl">إجمالي السدادات</div></div>
    </div>

    <div class="card mt-3">
      <canvas id="reportChart" height="180"></canvas>
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn btn-outline btn-block" onclick="exportPDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
      <button class="btn btn-outline btn-block" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
      <button class="btn btn-primary btn-block" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة</button>
    </div>

    <div class="section-title mt-3">تفاصيل العمليات</div>
    <div class="card" id="reportTableWrap">
      <div class="skeleton" style="height:60px;"></div>
    </div>

  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
