<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل سداد - أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="icon-btn" href="javascript:history.back()"><i class="fa-solid fa-arrow-right"></i></a>
  <div style="flex:1;text-align:center;font-weight:800;">تسجيل سداد</div>
  <a class="icon-btn" href="dashboard.html"><i class="fa-solid fa-xmark"></i></a>
</div>

<div class="container-app">

  <div class="panel" style="margin-bottom:18px;background:#E4F9EC;border:none;">
    <div class="text-muted-app" style="font-size:.8rem;">الرصيد المتبقي على العميل</div>
    <div style="font-weight:800;font-size:1.4rem;color:var(--green-darker);margin-top:4px;" id="custBalance">0 ريال</div>
  </div>

  <form id="paymentForm">
    <div class="field">
      <label>اختر العميل</label>
      <select class="control" id="customerSelect" required></select>
    </div>

    <div class="field">
      <label>نوع الدفع</label>
      <div class="btn-row">
        <button type="button" class="chip active" id="btnPartial" style="padding:12px;width:100%;" onclick="setPayType('partial')">دفعة جزئية</button>
        <button type="button" class="chip" id="btnFull" style="padding:12px;width:100%;" onclick="setPayType('full')">دفع كامل</button>
      </div>
    </div>

    <div class="field">
      <label>المبلغ المدفوع</label>
      <div style="position:relative">
        <input class="control" type="number" min="1" step="0.01" id="payAmount" placeholder="0.00" required style="padding-left:60px">
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;">ريال</span>
      </div>
    </div>

    <div class="field">
      <label>طريقة الدفع</label>
      <select class="control" id="payMethod">
        <option>نقدية</option>
        <option>تحويل بنكي</option>
        <option>محفظة إلكترونية</option>
        <option>شيك</option>
      </select>
    </div>

    <div class="field">
      <label>ملاحظات</label>
      <textarea class="control" id="payNotes" placeholder="ملاحظات إضافية..."></textarea>
    </div>

    <button type="submit" class="btn-app btn-green" style="margin-bottom:12px;"><i class="fa-solid fa-floppy-disk"></i> حفظ العملية</button>
    <button type="submit" data-action="print" class="btn-app btn-light" style="margin-bottom:20px;"><i class="fa-solid fa-print"></i> حفظ وطباعة</button>
  </form>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/firebase.js"></script>
<script src="js/payments.js"></script>
</body>
</html>
