<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تسجيل الدخول</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">

<!-- خطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<!-- مكتبات -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-logo">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
    <h2>أمان للديون</h2>
    <p>إدارة ذكية وآمنة لديون عملائك اليومية</p>
  </div>

  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="switchAuthTab('login')">تسجيل الدخول</button>
      <button id="tabRegister" onclick="switchAuthTab('register')">إنشاء حساب</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <form id="formLogin" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="loginEmail" class="form-control" placeholder="example@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      <div class="toggle-row">
        <label style="font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="rememberMe" style="width:16px;height:16px;"> تذكرني
        </label>
        <a href="#" class="auth-link" onclick="handleForgotPassword(); return false;">نسيت كلمة المرور؟</a>
      </div>
      <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg mt-2">تسجيل الدخول</button>
    </form>

    <!-- نموذج إنشاء حساب -->
    <form id="formRegister" class="d-none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">الاسم الكامل</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="regName" class="form-control" placeholder="اسمك الكامل" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="regEmail" class="form-control" placeholder="example@email.com" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword" class="form-control" placeholder="6 أحرف على الأقل" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">تأكيد كلمة المرور</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="regPassword2" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" id="registerBtn" class="btn btn-accent btn-block btn-lg mt-2">إنشاء حساب</button>
    </form>
  </div>

  <p style="text-align:center;color:#7C8698;font-size:12px;margin-top:20px;">
    © 2026 أمان للديون - جميع الحقوق محفوظة
  </p>
</div>

<!-- مكتبات JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
