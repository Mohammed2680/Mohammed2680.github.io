<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ملف العميل</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <button class="icon-btn" onclick="history.back()"><i class="fa-solid fa-arrow-right"></i></button>
  <div class="brand"><span>ملف العميل</span></div>
  <div style="display:flex;gap:6px;">
    <button class="icon-btn" onclick="editCurrentCustomer()"><i class="fa-solid fa-pen"></i></button>
    <button class="icon-btn" onclick="deleteCurrentCustomer()"><i class="fa-solid fa-trash"></i></button>
  </div>
</div>

<div class="app-container">
  <div class="page-content" id="customerContent">
    <div class="skeleton" style="height:120px;margin-bottom:14px;"></div>
    <div class="skeleton" style="height:80px;"></div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script>
  initProtectedPage('customers');
  const customerId = new URLSearchParams(location.search).get('id');
  let customerData = null;

  async function loadCustomer(){
    if (!customerId){ window.location.href = 'customers.html'; return; }
    customerData = await DataLayer.getById('customers', customerId);
    if (!customerData){ toastError('العميل غير موجود'); setTimeout(()=>location.href='customers.html', 1200); return; }

    const [debts, payments] = await Promise.all([
      DataLayer.getAll('debts'),
      DataLayer.getAll('payments')
    ]);
    const myDebts = debts.filter(d => d.customerId === customerId);
    const myPayments = payments.filter(p => p.customerId === customerId);
    const totalDebt = myDebts.reduce((s,d)=>s+Number(d.amount||0),0);
    const totalPaid = myPayments.reduce((s,p)=>s+Number(p.amount||0),0);
    const remaining = Math.max(totalDebt - totalPaid, 0);

    const timeline = [
      ...myDebts.map(d => ({...d, type:'debt'})),
      ...myPayments.map(p => ({...p, type:'payment'}))
    ].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

    document.getElementById('customerContent').innerHTML = `
      <div class="card text-center mb-3">
        <div class="avatar" style="width:76px;height:76px;font-size:26px;margin:0 auto 10px;">
          ${customerData.image ? `<img src="${customerData.image}">` : initials(customerData.name)}
        </div>
        <h5 class="fw-bold mb-1">${customerData.name}</h5>
        <p class="text-muted-sm mb-1"><i class="fa-solid fa-phone"></i> ${customerData.phone||'-'}</p>
        ${customerData.address ? `<p class="text-muted-sm mb-1"><i class="fa-solid fa-location-dot"></i> ${customerData.address}</p>` : ''}
        ${customerData.notes ? `<p class="text-muted-sm mb-0"><i class="fa-solid fa-note-sticky"></i> ${customerData.notes}</p>` : ''}
      </div>

      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div class="mini-stat navy"><div class="num">${totalDebt.toLocaleString('ar-EG')}</div><div class="lbl">إجمالي الدين</div></div>
        <div class="mini-stat green"><div class="num">${totalPaid.toLocaleString('ar-EG')}</div><div class="lbl">المدفوع</div></div>
        <div class="mini-stat danger"><div class="num">${remaining.toLocaleString('ar-EG')}</div><div class="lbl">المتبقي</div></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:14px;">
        <a href="new-debt.html?customer=${customerId}" class="btn btn-primary btn-block"><i class="fa-solid fa-file-circle-plus"></i> إضافة دين</a>
        <a href="payment.html?customer=${customerId}" class="btn btn-accent btn-block"><i class="fa-solid fa-hand-holding-dollar"></i> تسجيل سداد</a>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px;">
        <button class="btn btn-outline btn-block" onclick="printStatement()"><i class="fa-solid fa-file-lines"></i> طباعة كشف حساب</button>
        <a href="invoices.html?customer=${customerId}" class="btn btn-outline btn-block"><i class="fa-solid fa-receipt"></i> عرض الفواتير</a>
      </div>

      <div class="section-title">سجل العمليات</div>
      <div class="card">
        ${timeline.length === 0 ? `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>لا توجد عمليات بعد</p></div>` :
        timeline.map(t => `
          <div class="transaction-row">
            <div class="t-icon ${t.type}"><i class="fa-solid ${t.type==='debt'?'fa-arrow-up':'fa-arrow-down'}"></i></div>
            <div class="t-info">
              <div class="t-title">${t.type==='debt' ? (t.reason||'دين جديد') : 'سداد دفعة'}</div>
              <div class="t-date">${formatDate(t.createdAt)} - ${formatTime(t.createdAt)}</div>
            </div>
            <div class="t-amount ${t.type}">${t.type==='debt'?'+':'-'}${Number(t.amount||0).toLocaleString('ar-EG')}</div>
          </div>
        `).join('')}
      </div>

      <div id="printableStatement" style="display:none;">
        <div class="invoice-paper">
          <div class="inv-header">
            <div class="logo avatar" style="margin:0 auto;">🛡️</div>
            <h5 class="fw-bold">${getSettings().appName}</h5>
            <p class="text-muted-sm">كشف حساب عميل</p>
          </div>
          <hr>
          <div class="inv-row"><span>اسم العميل</span><b>${customerData.name}</b></div>
          <div class="inv-row"><span>الهاتف</span><b>${customerData.phone||'-'}</b></div>
          <div class="inv-row"><span>تاريخ الطباعة</span><b>${formatDate(nowISO())}</b></div>
          <hr>
          ${timeline.map(t => `<div class="inv-row"><span>${formatDate(t.createdAt)} - ${t.type==='debt'?(t.reason||'دين'):'سداد'}</span><b>${t.type==='debt'?'+':'-'}${Number(t.amount||0).toLocaleString('ar-EG')}</b></div>`).join('')}
          <hr>
          <div class="inv-row inv-total"><span>الإجمالي</span><b>${totalDebt.toLocaleString('ar-EG')}</b></div>
          <div class="inv-row inv-total"><span>المدفوع</span><b>${totalPaid.toLocaleString('ar-EG')}</b></div>
          <div class="inv-row inv-total"><span>المتبقي</span><b>${remaining.toLocaleString('ar-EG')}</b></div>
        </div>
      </div>
    `;
  }

  function printStatement(){
    const content = document.getElementById('printableStatement').innerHTML;
    const w = window.open('', '_blank');
    w.document.write(`<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف حساب</title>
      <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
      <style>body{font-family:'Tajawal',sans-serif;padding:20px;} .inv-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #ddd;} .inv-total{font-weight:800;font-size:16px;} hr{border:none;border-top:1px dashed #ccc;}</style>
      </head><body>${content}</body></html>`);
    w.document.close();
    setTimeout(() => w.print(), 400);
  }

  function editCurrentCustomer(){
    if (!customerData) return;
    localStorage.setItem('aman_edit_customer', JSON.stringify(customerData));
    window.location.href = 'customers.html?edit=' + customerData.id;
  }

  async function deleteCurrentCustomer(){
    const ok = await confirmDialog('حذف العميل', 'سيتم حذف العميل وكل بياناته. هل أنت متأكد؟');
    if (!ok) return;
    await DataLayer.remove('customers', customerId);
    toastSuccess('تم حذف العميل');
    setTimeout(() => window.location.href = 'customers.html', 800);
  }

  loadCustomer();
</script>
</body>
</html>
