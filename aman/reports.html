<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقارير - أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div style="width:42px;"></div>
  <div style="flex:1;text-align:center;font-weight:800;">التقارير</div>
  <div class="icon-btn no-print" onclick="window.print()"><i class="fa-solid fa-print"></i></div>
</div>

<div class="container-app">

  <div class="chip-row">
    <div class="chip active" data-range="daily">يومي</div>
    <div class="chip" data-range="weekly">أسبوعي</div>
    <div class="chip" data-range="monthly">شهري</div>
    <div class="chip" data-range="yearly">سنوي</div>
  </div>

  <div class="field mt-app">
    <label>عرض حسب عميل معيّن (اختياري)</label>
    <select class="control" id="custFilter">
      <option value="">كل العملاء</option>
    </select>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="st-icon" style="background:var(--red-bg);color:var(--red)"><i class="fa-solid fa-arrow-trend-up"></i></div>
      <div class="st-value" id="repDebts">0</div>
      <div class="st-label">إجمالي الديون الجديدة</div>
    </div>
    <div class="stat-card">
      <div class="st-icon" style="background:#E4F9EC;color:var(--green-darker)"><i class="fa-solid fa-hand-holding-dollar"></i></div>
      <div class="st-value" id="repPayments">0</div>
      <div class="st-label">إجمالي المحصّل</div>
    </div>
  </div>

  <div class="panel mt-app" style="height:230px;">
    <canvas id="repChart"></canvas>
  </div>

  <div class="section-head"><h2>تفاصيل العمليات</h2></div>
  <div id="repList"></div>

  <div class="btn-row mt-app" style="margin-bottom:24px;">
    <button class="btn-app btn-navy" onclick="exportPdf()"><i class="fa-solid fa-file-pdf"></i> تصدير PDF</button>
    <button class="btn-app btn-light" onclick="exportExcel()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/app.js"></script>
<script src="js/firebase.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
