<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الإعدادات</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-shield-halved"></i></div><span>الإعدادات</span></div>
  <div style="width:40px;"></div>
</div>

<div class="app-container">
  <div class="page-content">

    <div class="card mb-3 text-center">
      <label for="logoInput" style="cursor:pointer;">
        <div class="avatar" id="logoPreview" style="width:80px;height:80px;font-size:26px;margin:0 auto;">🛡️</div>
        <div class="text-muted-sm mt-2"><i class="fa-solid fa-camera"></i> تغيير الشعار</div>
      </label>
      <input type="file" id="logoInput" accept="image/*" class="d-none" onchange="onLogoChange(event)">
    </div>

    <div class="card mb-3">
      <div class="form-group">
        <label class="form-label">اسم النشاط التجاري</label>
        <input type="text" id="settingAppName" class="form-control">
      </div>
      <div class="form-group mb-0">
        <label class="form-label">العملة المستخدمة</label>
        <select id="settingCurrency" class="form-select">
          <option value="ريال يمني">ريال يمني</option>
          <option value="دولار أمريكي">دولار أمريكي</option>
          <option value="ريال سعودي">ريال سعودي</option>
          <option value="جنيه مصري">جنيه مصري</option>
        </select>
      </div>
    </div>

    <div class="card mb-3">
      <div class="form-group mb-0">
        <label class="form-label">حجم طابعة الفواتير الافتراضي</label>
        <select id="settingPrinter" class="form-select">
          <option value="80">80mm</option>
          <option value="58">58mm</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary btn-block btn-lg mb-3" onclick="saveAllSettings()">حفظ التغييرات</button>

    <div class="card mb-3">
      <div class="toggle-row">
        <span class="fw-bold"><i class="fa-solid fa-moon"></i> الوضع الليلي</span>
        <label class="switch">
          <input type="checkbox" id="darkModeToggle" onchange="toggleDarkMode()">
          <span class="slider-toggle"></span>
        </label>
      </div>
    </div>

    <div class="section-title">النسخ الاحتياطي والاستعادة</div>
    <div class="card mb-3">
      <button class="btn btn-outline btn-block mb-2" onclick="backupData()"><i class="fa-solid fa-cloud-arrow-down"></i> تنزيل نسخة احتياطية</button>
      <label class="btn btn-outline btn-block mb-0" style="cursor:pointer;">
        <i class="fa-solid fa-cloud-arrow-up"></i> استعادة البيانات
        <input type="file" accept=".json" class="d-none" onchange="restoreData(event)">
      </label>
    </div>

    <div class="section-title">الحساب</div>
    <div class="card mb-3">
      <p class="mb-1"><b id="settingsUserName"></b></p>
      <p class="text-muted-sm mb-3" id="settingsUserEmail"></p>
      <button class="btn btn-danger btn-block" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج</button>
    </div>

    <p class="text-center text-muted-sm">إصدار التطبيق 1.0.0</p>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/settings.js"></script>
</body>
</html>
