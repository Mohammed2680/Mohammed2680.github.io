<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الرئيسية</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-shield-halved"></i></div><span id="appNameTop">أمان للديون</span></div>
  <div style="display:flex;gap:8px;position:relative;">
    <button class="icon-btn" onclick="window.location.href='reports.html'"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button class="icon-btn badge" id="notifBtn" data-count="0" onclick="showLateDebtsAlert()"><i class="fa-solid fa-bell"></i></button>
  </div>
</div>

<div class="app-container">
  <div class="page-content">

    <p class="text-muted-sm" id="welcomeMsg">أهلاً بك 👋</p>

    <!-- إجمالي الديون -->
    <div class="stat-card">
      <div class="label">إجمالي الديون المتبقية</div>
      <div class="value" id="totalDebt">0 <small>ريال يمني</small></div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="collectionProgress" style="width:0%"></div>
      </div>
      <p style="font-size:11px;opacity:.8;margin:8px 0 0;">نسبة التحصيل: <span id="collectionPct">0%</span></p>
    </div>

    <!-- إحصائيات مصغرة -->
    <div class="stat-grid">
      <div class="mini-stat navy">
        <i class="fa-solid fa-users"></i>
        <div class="num" id="customersCount">0</div>
        <div class="lbl">عدد العملاء</div>
      </div>
      <div class="mini-stat green">
        <i class="fa-solid fa-sack-dollar"></i>
        <div class="num" id="paidToday">0</div>
        <div class="lbl">المدفوع اليوم</div>
      </div>
      <div class="mini-stat warn">
        <i class="fa-solid fa-hourglass-half"></i>
        <div class="num" id="remainingTotal">0</div>
        <div class="lbl">المتبقي</div>
      </div>
      <div class="mini-stat danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <div class="num" id="lateCount">0</div>
        <div class="lbl">ديون متأخرة</div>
      </div>
    </div>

    <!-- أزرار إضافة سريعة -->
    <div class="section-title">إجراءات سريعة</div>
    <div style="display:flex;gap:10px;">
      <a href="new-debt.html" class="btn btn-primary btn-block"><i class="fa-solid fa-file-circle-plus"></i> إضافة دين</a>
      <a href="payment.html" class="btn btn-accent btn-block"><i class="fa-solid fa-hand-holding-dollar"></i> تسجيل سداد</a>
    </div>

    <!-- آخر العمليات -->
    <div class="section-title">آخر العمليات <a href="reports.html">عرض الكل</a></div>
    <div class="card" id="recentTransactions">
      <div class="skeleton" style="height:50px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:50px;"></div>
    </div>

  </div>
</div>

<a href="new-debt.html" class="fab"><i class="fa-solid fa-plus"></i></a>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script>
  initProtectedPage('dashboard');
  const session = currentSession();
  document.getElementById('welcomeMsg').textContent = `أهلاً بك، ${session?.name || 'صديقنا'} 👋`;
  document.getElementById('appNameTop').textContent = getSettings().appName;

  async function loadDashboard(){
    const [customers, debts, payments] = await Promise.all([
      DataLayer.getAll('customers'),
      DataLayer.getAll('debts'),
      DataLayer.getAll('payments')
    ]);

    const totalDebt = debts.reduce((s,d) => s + Number(d.amount||0), 0);
    const totalPaid = payments.reduce((s,p) => s + Number(p.amount||0), 0);
    const remaining = Math.max(totalDebt - totalPaid, 0);
    const todayStr = new Date().toDateString();
    const paidToday = payments.filter(p => new Date(p.createdAt).toDateString() === todayStr)
                               .reduce((s,p) => s + Number(p.amount||0), 0);
    const lateCount = debts.filter(d => {
      const paidForDebt = payments.filter(p => p.debtId === d.id).reduce((s,p)=>s+Number(p.amount||0),0);
      return paidForDebt < Number(d.amount||0) && d.dueDate && new Date(d.dueDate) < new Date();
    }).length;

    document.getElementById('totalDebt').innerHTML = `${remaining.toLocaleString('ar-EG')} <small>${getSettings().currency}</small>`;
    document.getElementById('customersCount').textContent = customers.length;
    document.getElementById('paidToday').textContent = paidToday.toLocaleString('ar-EG');
    document.getElementById('remainingTotal').textContent = remaining.toLocaleString('ar-EG');
    document.getElementById('lateCount').textContent = lateCount;
    document.getElementById('notifBtn').setAttribute('data-count', lateCount);

    const pct = totalDebt > 0 ? Math.min(100, Math.round((totalPaid/totalDebt)*100)) : 0;
    document.getElementById('collectionProgress').style.width = pct + '%';
    document.getElementById('collectionPct').textContent = pct + '%';

    // آخر العمليات (دمج الديون والسدادات)
    const all = [
      ...debts.map(d => ({ ...d, type:'debt' })),
      ...payments.map(p => ({ ...p, type:'payment' }))
    ].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 8);

    const box = document.getElementById('recentTransactions');
    if (all.length === 0){
      box.innerHTML = `<div class="empty-state"><i class="fa-regular fa-folder-open"></i><p>لا توجد عمليات بعد</p></div>`;
      return;
    }
    box.innerHTML = all.map(t => `
      <div class="transaction-row">
        <div class="t-icon ${t.type}"><i class="fa-solid ${t.type === 'debt' ? 'fa-arrow-up' : 'fa-arrow-down'}"></i></div>
        <div class="t-info">
          <div class="t-title">${t.customerName || 'عميل'}</div>
          <div class="t-date">${formatDate(t.createdAt)} - ${formatTime(t.createdAt)}</div>
        </div>
        <div class="t-amount ${t.type}">${t.type === 'debt' ? '+' : '-'}${Number(t.amount||0).toLocaleString('ar-EG')}</div>
      </div>
    `).join('');
  }

  async function showLateDebtsAlert(){
    const n = await getLateDebtsCount();
    Swal.fire({
      icon: n > 0 ? 'warning' : 'info',
      title: n > 0 ? `لديك ${n} دين متأخر` : 'لا توجد ديون متأخرة',
      text: n > 0 ? 'يرجى متابعة العملاء المتأخرين عن السداد' : 'كل الديون ضمن مواعيدها 👍',
      confirmButtonText: 'حسنًا',
      confirmButtonColor: '#0B2A5B'
    });
  }

  loadDashboard();
  DataLayer.watch('debts', loadDashboard);
  DataLayer.watch('payments', loadDashboard);
</script>
</body>
</html>
