<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الفواتير</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-shield-halved"></i></div><span>الفواتير</span></div>
  <div style="width:40px;"></div>
</div>

<div class="app-container">
  <div class="page-content">

    <div class="search-bar">
      <input type="text" id="invSearch" placeholder="ابحث برقم الفاتورة أو اسم العميل...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="chip-scroll mb-3">
      <button class="chip active" data-t="all">الكل</button>
      <button class="chip" data-t="debt">فواتير ديون</button>
      <button class="chip" data-t="payment">فواتير سداد</button>
    </div>

    <div id="invoicesList">
      <div class="skeleton" style="height:70px;margin-bottom:10px;"></div>
      <div class="skeleton" style="height:70px;"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Modal عرض الفاتورة -->
<div class="modal fade" id="invoiceModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header" style="border:none;">
        <h5 class="modal-title fw-bold">معاينة الفاتورة</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="chip-scroll mb-3">
          <button class="chip active" id="size80" onclick="setPrinterSize('80')">طابعة 80mm</button>
          <button class="chip" id="size58" onclick="setPrinterSize('58')">طابعة 58mm</button>
        </div>
        <div id="invoicePreview"></div>
        <div class="print-actions">
          <button class="btn btn-primary btn-block" onclick="printInvoice()"><i class="fa-solid fa-print"></i> طباعة</button>
          <button class="btn btn-outline btn-block" onclick="downloadInvoicePDF()"><i class="fa-solid fa-file-pdf"></i> PDF</button>
          <button class="btn btn-accent btn-block" onclick="shareInvoiceWhatsapp()"><i class="fa-brands fa-whatsapp"></i> واتساب</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/invoices.js"></script>
</body>
</html>
