<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>طرق السداد - أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="icon-btn" href="settings.html"><i class="fa-solid fa-arrow-right"></i></a>
  <div style="flex:1;text-align:center;font-weight:800;">طرق السداد</div>
  <div style="width:42px;"></div>
</div>

<div class="container-app">

  <div class="settings-group">
    <h3>إعدادات القسم العامة</h3>
    <div class="settings-row">
      <div class="sr-left"><div class="sr-icon"><i class="fa-solid fa-eye"></i></div><span>إظهار قسم طرق السداد في الفواتير</span></div>
      <label class="switch"><input type="checkbox" id="pmEnabled" checked><span class="slider"></span></label>
    </div>
    <div class="settings-row">
      <div class="sr-left"><div class="sr-icon"><i class="fa-solid fa-filter"></i></div><span>نطاق الظهور</span></div>
      <select id="pmScope" style="border:none;background:transparent;font-weight:700;color:var(--navy);">
        <option value="all">جميع الفواتير</option>
        <option value="creditOnly">الفواتير الآجلة فقط</option>
      </select>
    </div>
  </div>

  <div class="section-head">
    <h2>وسائل السداد</h2>
    <a href="#" onclick="openMethodForm();return false;"><i class="fa-solid fa-plus"></i> إضافة</a>
  </div>
  <div class="text-muted-app" style="font-size:.78rem;margin:-6px 0 12px;"><i class="fa-solid fa-arrows-up-down"></i> اسحب <i class="fa-solid fa-grip-lines"></i> لإعادة الترتيب</div>
  <div id="methodsList"></div>

  <div class="settings-group mt-app">
    <h3>رسالة أسفل قسم السداد</h3>
    <div class="panel">
      <textarea class="control" id="paymentNoteInput" rows="3" placeholder="يرجى إرسال إشعار التحويل مع ذكر رقم الفاتورة لتأكيد عملية السداد..."></textarea>
    </div>
  </div>

  <div style="height:20px;"></div>
</div>

<!-- نافذة إضافة/تعديل وسيلة سداد -->
<div class="modal fade" id="methodModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header" style="border:none;">
        <h5 class="modal-title" id="methodModalTitle">إضافة وسيلة سداد</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="methodForm">
          <input type="hidden" id="mId">
          <div class="field">
            <label>اسم وسيلة السداد</label>
            <input class="control" id="mName" required placeholder="مثال: الكريمي / حساب بنكي / نقاط بيع">
          </div>
          <div class="field">
            <label>أيقونة (اختياري - افتراضية إن لم تُرفع)</label>
            <select class="control" id="mIconSelect">
              <option value="fa-solid fa-wallet">محفظة</option>
              <option value="fa-solid fa-money-bill-wave">نقدية</option>
              <option value="fa-solid fa-building-columns">بنك</option>
              <option value="fa-solid fa-mobile-screen-button">تطبيق جوال</option>
              <option value="fa-solid fa-cash-register">نقطة بيع</option>
              <option value="fa-solid fa-credit-card">بطاقة</option>
              <option value="fa-solid fa-university">مؤسسة مالية</option>
            </select>
          </div>
          <div class="field">
            <label>شعار/أيقونة مخصصة (اختياري)</label>
            <div class="upload-box" onclick="document.getElementById('mLogoFile').click()">
              <i class="fa-solid fa-image"></i>
              <span id="mLogoLabel">ارفع صورة الشعار</span>
              <input type="file" id="mLogoFile" accept="image/*" class="hidden">
            </div>
          </div>
          <div class="field">
            <label>رمز QR (اختياري)</label>
            <div class="upload-box" onclick="document.getElementById('mQrFile').click()">
              <i class="fa-solid fa-qrcode"></i>
              <span id="mQrLabel">ارفع صورة QR</span>
              <input type="file" id="mQrFile" accept="image/*" class="hidden">
            </div>
          </div>

          <div class="field">
            <label>بيانات إضافية (مثل رقم الآيبان / اسم المستفيد / رقم الحساب)</label>
            <div id="detailsWrap"></div>
            <button type="button" class="btn-app btn-outline" style="margin-top:6px;" onclick="addDetailRow()"><i class="fa-solid fa-plus"></i> إضافة حقل</button>
          </div>

          <div class="field" style="display:flex;align-items:center;justify-content:space-between;">
            <label style="margin:0;">إظهار هذه الوسيلة في الفواتير</label>
            <label class="switch"><input type="checkbox" id="mVisible" checked><span class="slider"></span></label>
          </div>
          <div class="field">
            <label>تظهر في</label>
            <select class="control" id="mScope">
              <option value="all">جميع الفواتير</option>
              <option value="credit">الفواتير الآجلة فقط</option>
            </select>
          </div>

          <div class="btn-row">
            <button type="submit" class="btn-app btn-navy"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
            <button type="button" class="btn-app btn-outline" id="deleteMethodBtn" style="display:none;color:var(--red);" onclick="deleteCurrentMethod()"><i class="fa-solid fa-trash"></i> حذف</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/firebase.js"></script>
<script src="js/settings-payment-methods.js"></script>
</body>
</html>
