<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>العملاء</title>
<meta name="theme-color" content="#0B2A5B">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>

<nav id="desktopSidebar" class="desktop-sidebar"></nav>

<div class="topbar">
  <div class="brand"><div class="logo"><i class="fa-solid fa-shield-halved"></i></div><span>العملاء</span></div>
  <button class="icon-btn" onclick="openCustomerModal()"><i class="fa-solid fa-plus"></i></button>
</div>

<div class="app-container">
  <div class="page-content">

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="ابحث بالاسم أو رقم الهاتف...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>

    <div class="chip-scroll mb-2">
      <button class="chip active" data-filter="all">الكل</button>
      <button class="chip" data-filter="late">متأخرون</button>
      <button class="chip" data-filter="paid">مسددون بالكامل</button>
      <button class="chip" data-filter="pending">لديهم رصيد</button>
    </div>
    <div class="chip-scroll mb-3">
      <button class="chip active" data-sort="name">الاسم</button>
      <button class="chip" data-sort="debt">الأكثر دينًا</button>
      <button class="chip" data-sort="recent">الأحدث</button>
    </div>

    <div id="customersList">
      <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
      <div class="skeleton" style="height:80px;"></div>
    </div>

  </div>
</div>

<a href="#" class="fab" onclick="openCustomerModal(); return false;"><i class="fa-solid fa-user-plus"></i></a>
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Modal إضافة/تعديل عميل -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header" style="border:none;">
        <h5 class="modal-title fw-bold" id="customerModalTitle">إضافة عميل جديد</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="customerForm" onsubmit="saveCustomer(event)">
        <div class="modal-body">
          <input type="hidden" id="custId">
          <div class="text-center mb-3">
            <label for="custImageInput" style="cursor:pointer;">
              <div class="avatar" id="custAvatarPreview" style="width:80px;height:80px;font-size:26px;margin:0 auto;">؟</div>
              <div class="text-muted-sm mt-2"><i class="fa-solid fa-camera"></i> إضافة صورة</div>
            </label>
            <input type="file" id="custImageInput" accept="image/*" class="d-none" onchange="previewCustomerImage(event)">
          </div>
          <div class="form-group">
            <label class="form-label">اسم العميل *</label>
            <input type="text" id="custName" class="form-control" placeholder="مثال: محمد أحمد" required>
          </div>
          <div class="form-group">
            <label class="form-label">رقم الهاتف *</label>
            <input type="tel" id="custPhone" class="form-control" placeholder="7XXXXXXXX" required>
          </div>
          <div class="form-group">
            <label class="form-label">العنوان</label>
            <input type="text" id="custAddress" class="form-control" placeholder="مثال: صنعاء - شارع حدة">
          </div>
          <div class="form-group mb-0">
            <label class="form-label">ملاحظات</label>
            <textarea id="custNotes" class="form-control" rows="2" placeholder="ملاحظات إضافية..."></textarea>
          </div>
        </div>
        <div class="modal-footer" style="border:none;">
          <button type="submit" class="btn btn-primary btn-block w-100">حفظ العميل</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/app.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
