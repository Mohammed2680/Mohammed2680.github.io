<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>إضافة دين جديد - أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <a class="icon-btn" href="customers.html"><i class="fa-solid fa-magnifying-glass"></i></a>
  <div style="flex:1;text-align:center;font-weight:800;">إضافة دين جديد</div>
  <a class="icon-btn" href="dashboard.html"><i class="fa-solid fa-xmark"></i></a>
</div>

<div class="container-app">

  <div class="panel" style="margin-bottom:18px;background:var(--blue-bg);border:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <div class="text-muted-app" style="font-size:.8rem;">الحالة المالية الحالية</div>
        <div style="font-weight:800;font-size:1.3rem;color:var(--red);margin-top:4px;" id="currentTotal">0 ريال</div>
      </div>
      <div style="font-size:.8rem;font-weight:700;color:var(--navy);">إجمالي الديون المستحقة</div>
    </div>
  </div>

  <form id="newDebtForm">
    <div class="field">
      <label>اختر العميل</label>
      <select class="control" id="customerSelect" required></select>
    </div>

    <div class="field">
      <label>المبلغ المستحق</label>
      <div style="position:relative">
        <input class="control" type="number" min="1" step="0.01" id="debtAmount" placeholder="0.00" required style="padding-left:60px">
        <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;">ريال يمني</span>
      </div>
    </div>

    <div class="field">
      <label>سبب الدين</label>
      <input class="control" id="debtReason" placeholder="مثال: كيس سكر 10 كيلو">
    </div>

    <div class="field">
      <label>تاريخ العملية</label>
      <input class="control" type="date" id="debtDate">
    </div>

    <div class="field">
      <label>إرفاق صورة السند (اختياري)</label>
      <div class="upload-box" onclick="document.getElementById('debtFile').click()">
        <i class="fa-solid fa-file-arrow-up"></i>
        ارفع ملف أو صورة
        <input type="file" id="debtFile" accept="image/*" class="hidden">
      </div>
    </div>

    <div class="field">
      <label>تفاصيل إضافية (اختياري)</label>
      <textarea class="control" id="debtNotes" placeholder="اكتب هنا ملاحظاتك عن نوع البضاعة أو سبب الدين..."></textarea>
    </div>

    <button type="submit" class="btn-app btn-navy" style="margin-bottom:12px;"><i class="fa-solid fa-floppy-disk"></i> حفظ العملية</button>
    <button type="submit" data-action="print" class="btn-app btn-light" style="margin-bottom:20px;"><i class="fa-solid fa-print"></i> حفظ وطباعة</button>
  </form>

  <div class="btn-row" style="margin-bottom:24px;">
    <div class="qa-card green" style="padding:16px;" onclick="toast('info','تمت مزامنة بياناتك سحابياً')">
      <div style="font-weight:800;font-size:.85rem;"><i class="fa-solid fa-cloud-arrow-up"></i> مزامنة سحابية</div>
    </div>
    <div class="qa-card navy" style="padding:16px;" onclick="location.href='reports.html'">
      <div style="font-weight:800;font-size:.85rem;color:var(--green);"><i class="fa-solid fa-shield-halved"></i> أمان بياناتك محمي بالكامل</div>
    </div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/firebase.js"></script>
<script src="js/debts.js"></script>
</body>
</html>
