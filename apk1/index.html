<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" href="assets/icons/icon-192.png">
<style>
  html,body{height:100%;margin:0;background:#0B2A5B;display:flex;align-items:center;justify-content:center;font-family:'Tajawal',sans-serif;}
  .splash{text-align:center;color:#fff;animation:fade 1s ease;}
  .splash .logo{width:90px;height:90px;background:#8EF0B2;border-radius:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:40px;color:#0B2A5B;}
  @keyframes fade{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .dots{margin-top:20px}
  .dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:#8EF0B2;margin:0 3px;animation:blink 1.4s infinite ease-in-out both;}
  .dots span:nth-child(2){animation-delay:.2s}
  .dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
  <div class="splash">
    <div class="logo">🛡️</div>
    <h2 style="margin:0;font-weight:800;">أمان للديون</h2>
    <p style="opacity:.75;font-size:13px;margin-top:6px;">إدارة ذكية لديون عملائك</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

<script>
  setTimeout(() => {
    const session = JSON.parse(localStorage.getItem('aman_session') || 'null');
    window.location.href = session ? 'dashboard.html' : 'login.html';
  }, 900);
</script>
</body>
</html>
