<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العملاء - أمان للديون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A5B">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="search-pill">
    <input id="searchBox" placeholder="بحث في العملاء...">
    <i class="fa-solid fa-magnifying-glass"></i>
  </div>
  <div class="icon-btn" onclick="document.getElementById('sortMenu').classList.toggle('hidden')"><i class="fa-solid fa-bars"></i></div>
</div>

<div class="container-app">

  <div class="hero-card">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:1.3rem;"><i class="fa-solid fa-wallet"></i></div>
      <div>
        <div class="hc-label">إجمالي المبالغ المستحقة</div>
        <div class="hc-amount" id="heroTotal" style="font-size:1.6rem;">0 <small>ريال</small></div>
      </div>
    </div>
  </div>

  <div class="chip-row mt-app">
    <div class="chip active" data-filter="all">الكل</div>
    <div class="chip" data-filter="debtor">مدينون</div>
    <div class="chip" data-filter="late">متأخرون</div>
    <div class="chip" data-filter="paid">المسددين</div>
  </div>

  <div id="sortMenu" class="hidden panel mt-app" style="display:flex;gap:10px;">
    <select class="control" id="sortSelect" style="border:1px solid var(--border);border-radius:10px;padding:8px;">
      <option value="recent">الأحدث نشاطاً</option>
      <option value="nameAsc">الاسم (أ-ي)</option>
      <option value="amountDesc">الأعلى ديناً</option>
      <option value="amountAsc">الأقل ديناً</option>
    </select>
  </div>

  <div id="customerList" class="mt-app"></div>
</div>

<button class="fab" id="addCustomerBtn"><i class="fa-solid fa-user-plus"></i></button>
<nav class="bottom-nav" id="bottomNav"></nav>

<!-- Offcanvas إضافة/تعديل عميل -->
<div class="modal fade" id="customerModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header" style="border:none;">
        <h5 class="modal-title" id="customerModalTitle">إضافة عميل جديد</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="customerForm">
          <input type="hidden" id="cId">
          <div class="field">
            <label>اسم العميل</label>
            <input class="control" id="cName" required placeholder="مثال: أحمد محمد">
          </div>
          <div class="field">
            <label>رقم الهاتف</label>
            <input class="control" id="cPhone" placeholder="7XXXXXXXX">
          </div>
          <div class="field">
            <label>العنوان</label>
            <input class="control" id="cAddress" placeholder="المدينة - الحي">
          </div>
          <div class="field">
            <label>ملاحظات</label>
            <textarea class="control" id="cNotes" placeholder="ملاحظات إضافية..."></textarea>
          </div>
          <button type="submit" class="btn-app btn-navy"><i class="fa-solid fa-floppy-disk"></i> حفظ العميل</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/app.js"></script>
<script src="js/firebase.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
